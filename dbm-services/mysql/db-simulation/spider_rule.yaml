SpiderCreateTableRule:
  ColChasetNotEqTbChaset:
    turnOn: true
    ban: true
    category: syntax
    desc: "create table 语句中列字符集定义与表字符集不一致"
    suggestion: "去掉列字符集"
  CreateWithSelect:
    turnOn: true
    ban: true
    category: syntax
    desc: "UNSUPPORT SQL CREATE TABLE WITH SELECT"
  ShardKeyNotPk:
    turnOn: true
    ban: true
    category: syntax
    desc: " CREATE TABLE shard_key 非主键"
  ShardKeyNotIndex:
    turnOn: true
    ban: true
    category: syntax
    desc: "CREATE TABLE shard_key 非索引键"
  IllegalComment:
    turnOn: true
    ban: true
    category: syntax
    desc: "非法的CREATE TABlE的COMMENT"
  NoIndexExists:
    turnOn: true
    ban: true
    category: platform
    desc: "没有任何索引存在"
    suggestion: "请添加索引、唯一键或主键"
  NoPubColAtMultUniqueIndex:
    turnOn: true
    ban: true
    category: syntax
    desc: "用户comment指定了shard_key,存在多个唯一健（含主键),shard_key只能是其中的共同部分"
  MustSpecialShardKeyOnlyHaveCommonIndex:
    turnOn: true
    ban: true
    category: syntax
    desc: "不存在唯一索引,只包含包含多个普通索引,则必须指定shard_key"
    suggestion: "请指定shard_key"
  ShardKeyNotNull:
    turnOn: true
    ban: true
    category: syntax
    desc: "如果是shard key 不是主键,默认值就一定要指定成 not null"
    suggestion: "请指定shard_key列 is not null"

AlterTableRule:
  HighRiskType:
    expr: " Val in Item "
    item:
      [
        "drop_column",
        "drop_key",
        "change_column",
        "rename_table",
        "rename_key",
        "convert_charset",
      ]
    desc: ""
    suggestion: "请在变更表时避免使用高危变更类型"
    extra_message_map:
      {
        "change_column": "变更字段类型会阻塞当前表的读写！！！",
        "drop_primary": "单独删除主键会重建表且不允许并发 DML，会阻塞当前表的读写！！！",
        "convert_charset": "CONVERT TO CHARACTER SET 会重建表且不允许并发 DML，会阻塞当前表的读写！！！",
      }
  HighRiskPkAlterType:
    expr: " Val in Item "
    item: ["add_column", "add_key", "change_column"]
    desc: "高危主键变更类型"
  AlterUseAfter:
    expr: " Val != Item "
    item: ""
    desc: "变更表时使用了after"
  AddColumnMixed:
    expr: " ( Item in Val ) && ( len(Val) > 1 ) "
    item: "add_column"
    desc: "加字段和其它alter table 类型混用，可能导致非在线加字段"

RenameTableRule:
  MultipleRenamePairsNotAllowed:
    expr: " Val > Item "
    item: 1
    desc: "重命名库表不支持一次指定多个表"
    ban: true
    category: platform
    suggestion: "建议拆分为多个rename语句来执行"

DmlRule:
  DmlNotHasWhere:
    expr: " Val != Item "
    item: true
    desc: "没有使用WHERE或者LIMIT,可能会导致全表数据更改"
