CommandRule:
  HighRiskCommandRule:
    expr: " Val in Item "
    desc: "高危命令"
    item:
      [
        "drop_db",
        "drop_table",
        "drop_index",
        "lock_tables",
        "analyze",
        "drop_procedure",
        "drop_view",
        "drop_trigger",
        "drop_function",
        "drop_server",
        "drop_event",
        "drop_compression_dictionary",
        "optimize",
      ]

  BanCommandRule:
    expr: " Val in Item "
    desc: "禁用命令"
    ban: true
    category: platform
    item:
      [
        "alter_db_upgrade",
        "alter_instance",
        "alter_server",
        "alter_tablespace",
        "alter_user",
        "analyze",
        "assign_to_keycache",
