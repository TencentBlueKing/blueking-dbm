        "check",
        "checksum",
        "create_compression_dictionary",
        "create_server",
        "create_spfunction",
        "create_user",
        "do",
        "grant",
        "drop_compression_dictionary",
        "drop_server",
        "drop_user",
        "explain_other",
        "get_diagnostics",
        "ha_close",
        "ha_open",
        "ha_read",
        "install_plugin",
        "kill",
        "load",
        "lock_binlog_for_backup",
        "lock_tables_for_backup",
        "optimize",
        "preload_keys",
        "purge",
        "purge_before",
        "release_savepoint",
        "rename_user",
        "repair",
        "reset",
        "resignal",
        "revoke",
        "revoke_all",
        "rollback_to_savepoint",
