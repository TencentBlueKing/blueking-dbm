hadbInfo:
  host: "127.0.0.1"
  port: 3306
  db: "hadb"
  user: "nouser"
  password: "nouser"
  charset: "utf8"
  # 连接池配置，可选；不配置或字段 <=0 时使用默认值
  # 默认值：maxOpenConns=50, maxIdleConns=10,
  #        connMaxLifetimeSec=1800, connMaxIdleTimeSec=300
  pool:
    maxOpenConns: 50
    maxIdleConns: 10
    connMaxLifetimeSec: 1800
    connMaxIdleTimeSec: 300
serverInfo:
  name: "model-api"
netInfo:
  port: "8080"
logInfo:
  logPath: "./log"
  logLevel: "LOG_DEBUG"
  logMaxsize: 1024
  logMaxbackups: 5
  logMaxage: 30
  logCompress: true
timezone:
  local: "CST"
