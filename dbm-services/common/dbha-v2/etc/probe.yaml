name: probe
version: v2.0.0

pidFile: ./pids/probe.pid

reporter:
  - name: gse
    endpoint: ""
    dataID: 0
    connTimeout: 5s

harvester:
  - name: mysql
    endpoint: ""
    user: root
    password: 123456
    interval: 20s

log:
  path: ./logs/probe.log
  level: debug
  fileCount: 10
  fileSize: 100
