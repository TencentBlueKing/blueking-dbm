name: probe
version: v2.0.0

pidFile: ./pids/probe.pid

reporter:
  - name: gse
    endpoint: ""
    dataID: 0
    connTimeout: 5s

harvester:
  mysql:
    user: "root"
    password: "root"
    # The time interval for each data collection from MySQL.
    interval: 20s

    endpoints:
      # If this 'proto' is not set, the default value is 'tcp'.
      - proto: tcp
        clusterType: ""
        machineType: ""
        accessLayer: ""
        ip: 127.0.0.1

        # Ports configuration format is: 1000~2000,20003, 3000, 5000-6000
        # The target port number to be probed are such that begin <= port <= end.
        ports: [1000-2000,20003, 3000, 5000-6000]
        adminPorts: []

  redis:
    password: ""
    interval: 20s
    timeout: 5s
    endpoints:
      - proto: tcp
        clusterType: ""
        machineType: ""
        accessLayer: ""
        ip: 127.0.0.1
        ports: [3306,10000-12000]
        adminPorts: []

log:
  path: ./logs/probe.log
  level: debug
  fileCount: 10
  fileSize: 100
