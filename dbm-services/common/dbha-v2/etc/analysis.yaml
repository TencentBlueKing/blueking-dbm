name: analysis
version: v2.0.0

discovery:
  endpoint: http://etcd-server:2379
  user: root
  password: 1234567890

apm:
  readTimeout: 10s
  writeTimeout: 10s
  listenAddress: http://127.0.0.1:8081

workflow:
  lockBusinessWaitTimeout: 5s
  scanTimeout: 60s
  scanInterval: 3s
  updateDbmCacheInterval: 10s
  readDbMetaOffsetDuration: -24h
  readDbMetricOffsetDuration: -60s
  readDbEventOffsetDuration: -10m

  dbmApiMetadata:
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/instances
    timeout: 10s
    token: ""

  dbmApiUpdateStatus:
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/update_status
    timeout: 10s
    token: ""

  dbmApiSwapMysqlRole:
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/swap_role
    timeout: 10s
    token: ""

  dbmApiSwapTendisCluster:
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/tendis_cluster_swap
    timeout: 10s
    token: ""

detector:
  ssh:
    port: 22
    user: root
    password: 123456789
    timeout: 10s

monitor:
  dataID: 0
  timeout: 10s
  accessToken: ""
  bkMonitorBeat: ""
  bkMonitorEndpoint: 127.0.0.1:9090

storage:
  endpoint: tcp://127.0.0.1:3306
  user: root
  password: 123456

log:
  path: /var/log/dbha/logs/analysis.log
  level: debug
  fileCount: 10
  fileSize: 100
