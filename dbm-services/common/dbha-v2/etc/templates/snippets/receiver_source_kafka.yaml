    - name: {{RECEIVER_SOURCE_KAFKA_NAME}}
      enable: {{RECEIVER_SOURCE_KAFKA_ENABLE}}
      endpoint: "{{RECEIVER_SOURCE_KAFKA_ENDPOINT}}"
      user: "{{RECEIVER_SOURCE_KAFKA_USER}}"
      password: "{{RECEIVER_SOURCE_KAFKA_PASSWORD}}"
      netDialTimeout: {{RECEIVER_SOURCE_KAFKA_NET_DIAL_TIMEOUT}}
      netReadTimeout: {{RECEIVER_SOURCE_KAFKA_NET_READ_TIMEOUT}}
      netWriteTimeout: {{RECEIVER_SOURCE_KAFKA_NET_WRITE_TIMEOUT}}
      mechanism: "{{RECEIVER_SOURCE_KAFKA_MECHANISM}}"
      topics: {{RECEIVER_SOURCE_KAFKA_TOPICS}}
      # kafka-only batch defaults: batchSize=500 (capped by channelBufferSize),
      # batchMaxBytes=4MB, batchLinger=0 (off), channelBufferSize=256, maxProcessingTime=1s
      batchSize: 500
      batchMaxBytes: 4194304
      batchLinger: 0s
      channelBufferSize: 256
      maxProcessingTime: 1s
