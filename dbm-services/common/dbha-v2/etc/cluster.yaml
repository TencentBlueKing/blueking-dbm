# mysql cluster
mysqlClusters:
  - domain: "testdb.dbha-test1.hz.db"
    domainSlave: "testdr.dbha-test1.hz.db"
    bkBizId: 1
    proxy: 
      - host: xxx.xxx.xxx.1
        port: 3306
        adminPort: 4306
      - host: xxx.xxx.xxx.2
        port: 3306
        adminPort: 4306
    
    master:
      host: xxx.xxx.xxx.3
      port: 3306
    
    slave:
      - host: xxx.xxx.xxx.4
        port: 3306
      - host: xxx.xxx.xxx.5
        port: 3306
    
    clb:
      - bkCloudId: 0
        region: "广州"
        listenerId: "xxx"
        loadbalancerId: "xxx"
        instances:
          - host: xxx.xxx.xxx.6
            port: 3306
          - host: xxx.xxx.xxx.7
            port: 3306

# tenDB cluster
tenDBClusters:
  - domain: "spider.dbha-test1.hz.db"
    domainSlave: "spider-slave.dbha-test1.hz.db"
    bkBizId: 1
    spider:
      - serverName: SPIDER0
        host: test-tspider0
        user: xxx
        password: xxx
        port: 3306
      - serverName: SPIDER1
        host: test-tspider1
        user: xxx
        password: xxx
        port: 3306

    spiderSlave:
      - serverName: SPIDER_SLAVE0
        host: test-tspider_slave0
        user: xxx
        password: xxx
        port: 3306

    ctlMaster:
      serverName: TDBCTL0
      host: test-tdbctl0
      user: xxx
      password: xxx
      port: 3306

    ctlSlave:
      - serverName: TDBCTL1
        host: test-tdbctl1
        user: xxx
        password: xxx
        port: 3306

    remoteMaster:
      - serverName: SPT0
        host: test-tendb-spt0
        user: xxx
        password: xxx
        port: 3306
      - serverName: SPT1
        host: test-tendb-spt1
        user: xxx
        password: xxx
        port: 3306

    remoteSlave:
      - serverName: SPT_SLAVE0
        host: test-tendb-spt_slave0
        user: xxx
        password: xxx
        port: 3306
        masterHost: test-tendb-spt0
        masterPort: 3306
      - serverName: SPT_SLAVE1
        host: test-tendb-spt_slave1
        user: xxx
        password: xxx
        port: 3306
        masterHost: test-tendb-spt1
        masterPort: 3306
    
    clb:
      - bkCloudId: 0
        region: "广州"
        listenerId: "xxx"
        loadbalancerId: "xxx"
        instances:
          - host: xxx.xxx.xxx.6
            port: 3306
          - host: xxx.xxx.xxx.7
            port: 3306

# redis clusters, grouped by cluster type the same way mysqlClusters and tenDBClusters are
TwemproxyRedisInstance:
  - domain: "cache.dbha-test1.hz.db"
    clusterId: 1001
    bkBizId: 1
    bkCloudId: 0
    proxy:
      - host: xxx.xxx.xxx.1
        port: 50000
        adminPort: 51000
      - host: xxx.xxx.xxx.2
        port: 50000
        adminPort: 51000

    # A shard is one master-slave group, i.e. one twemproxy backend.
    # It carries no redis-cluster slot information.
    shards:
      - master:
          host: xxx.xxx.xxx.3
          port: 30000
        slave:
          - host: xxx.xxx.xxx.4
            port: 30000
      - master:
          host: xxx.xxx.xxx.3
          port: 30001
        slave:
          - host: xxx.xxx.xxx.4
            port: 30001

    clb:
      - bkCloudId: 0
        region: "广州"
        listenerId: "xxx"
        loadbalancerId: "xxx"
        instances:
          - host: xxx.xxx.xxx.1
            port: 50000
          - host: xxx.xxx.xxx.2
            port: 50000

# proxy-only: the storage layer is never switched, so no shards are needed
PredixyRedisCluster:
  - domain: "cluster.dbha-test1.hz.db"
    clusterId: 1002
    bkBizId: 1
    bkCloudId: 0
    proxy:
      - host: xxx.xxx.xxx.5
        port: 50000
        adminPort: 51000

# The remaining redis keys follow the same shape:
#   RedisInstance / TwemproxyTendisSSDInstance / PredixyTendisplusInstance take shards,
#   PredixyTendisplusCluster is proxy-only.

