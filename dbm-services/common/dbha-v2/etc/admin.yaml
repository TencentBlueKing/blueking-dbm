name: admin
version: v2.0.0

pidFile: ./pids/admin.pid

docFileDir: ./docs

discovery:
  endpoint: http://127.0.0.1:2379
  user: root
  password: dbhatest

apm:
  readTimeout: 10s
  writeTimeout: 10s
  listenAddress: 127.0.0.1:8081

grpc:
  listenAddress: 127.0.0.1:50051

web:
  host: 127.0.0.1
  port: 8089
  readTimeout: 5s
  writeTimeout: 5s

dbmApi:
  - name: metadata
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/instances
    method: post
    timeout: 10s
    token: ""

  - name: updateStatus
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/update_status
    method: post
    timeout: 10s
    token: ""

  - name: swapMySQLRole
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/swap_role
    method: post
    timeout: 10s
    token: ""

  - name: swapTendisCluster
    api: http://127.0.0.1:80/apis/proxypass/dbmeta/dbha/tendis_cluster_swap
    method: post
    timeout: 10s
    token: ""

storage:
  endpoint: tcp://127.0.0.1:3306
  user: root
  password: dbhatest

log:
  path: ./logs/admin.log
  level: debug
  fileCount: 10
  fileSize: 100
