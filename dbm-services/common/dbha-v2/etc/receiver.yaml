name: receiver
version: v2.0.0

discovery:
  endpoint: http://etcd-server:2379
  user: root
  password: dbhatest

service:
  apm:
    readTimeout: 10s
    writeTimeout: 10s
    listenAddress: http://127.0.0.1:8081

  source:
    - name: probe
      enable: false
      endpoint: 127.0.0.1:25560

    - name: kafka
      enable: true
      endpoint: http://kafk-server:9092
      user: root
      password: 1234567890
      netDialTimeout: 30s
      netReadTimeout: 30s
      netWriteTimeout: 30s
      mechanism: plaintext
      topics: [test]

  sink:
    - name: mysql
      enable: true
      endpoint: 127.0.0.1:3306
      user: root
      password: dbhatest

log:
  path: /var/log/dbha/logs/receiver.log
  level: debug
  fileCount: 10
  fileSize: 100
