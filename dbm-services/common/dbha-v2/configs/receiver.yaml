name: receiver
version: v2.0.0

discovery:
  endpoints: http://etcd-server:2379
  user: root
  password: 1234567890

input:
  - name: probe
    enable: false
    endpoints: 127.0.0.1:25560

  - name: kafka
    enable: true
    endpoints: http://kafk-server:9092
    user: root
    password: 1234567890
    mechanism: plaintext
    topics: [test]

output:
  - name: mysql
    enable: false
    endpoints: 127.0.0.1:9030
    user: root
    password: 123456

log:
  path: /var/log/dbha/receiver.log
  level: debug
  fileCount: 10
  fileSize: 100
