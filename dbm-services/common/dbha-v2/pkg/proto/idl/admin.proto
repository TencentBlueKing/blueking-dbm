syntax             = "proto3";
option  go_package = ".;proto";

message Uptime {}

message HeartbeatRequest {
    string clientID                = 1;
    string configVersion           = 2;
    string configLastUpdated       = 3;
    string procStartedTime         = 4;
    string adminLastConnectTime    = 5;
    string receiverLastConnectTime = 6;
}

message HeartbeatResponse {
    int32  code   = 1;
    string errmsg = 2;
}

message ProbeConfigRequest {
    uint64 bkCloudId   = 1;
    string ip          = 2;
    string clientID    = 3;
    string version     = 4;
    uint64 updatedTime = 5;
}

// ProbeConfigCode result code for GetProbeConfig: success / failure / no data
enum ProbeConfigCode {
    PROBE_CONFIG_SUCCESS = 0;  // success
    PROBE_CONFIG_FAIL    = 1;  // failure
    PROBE_CONFIG_NO_DATA = 2;  // no data
}

message ProbeConfigResponse {
    ProbeConfigCode code    = 1;
    string          errmsg  = 2;
    string          payload = 3;
}

// HaServerInfo one live HA server instance registered in etcd
message HaServerInfo {
    string          role      = 1;  // admin | analysis | receiver
    string          id        = 2;
    repeated string ips       = 3;
    string          startTime = 4;  // 2006-01-02T15:04:05-07:00, Asia/Shanghai
    string          updatedAt = 5;  // 2006-01-02T15:04:05-07:00, Asia/Shanghai
    string          uptime    = 6;
}

message ListHaServersRequest {}

// HaServerListCode result code for ListHaServers: success / failure
enum HaServerListCode {
    HA_SERVER_LIST_SUCCESS = 0;  // success
    HA_SERVER_LIST_FAIL    = 1;  // failure
}

message ListHaServersResponse {
    HaServerListCode      code    = 1;
    string                errmsg  = 2;
    repeated HaServerInfo servers = 3;
    repeated string       ips     = 4;
}

service AdminService {
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {};
    rpc GetProbeConfig(ProbeConfigRequest) returns (ProbeConfigResponse) {};
    rpc ListHaServers(ListHaServersRequest) returns (ListHaServersResponse) {};
}
