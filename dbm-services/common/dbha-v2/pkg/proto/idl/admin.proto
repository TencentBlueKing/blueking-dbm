syntax             = "proto3";
option  go_package = ".;proto";

message Uptime {}

message HeartbeatRequest {
    string clientID                = 1;
    string configVersion           = 2;
    string configLastUpdated       = 3;
    string procStartedTime         = 4;
    string adminLastConnectTime    = 5;
    string receiverLastConnectTime = 6;
}

message HeartbeatResponse {
    int32  code   = 1;
    string errmsg = 2;
}

message ProbeConfigRequest {
    string clientID    = 1;
    string version     = 2;
    uint64 updatedTime = 3;
}

message ProbeConfigResponse {
    int32  code    = 1;
    string errmsg  = 2;
    string payload = 3;
}

service AdminService {
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {};
    rpc WatchConfig(stream ProbeConfigRequest) returns (stream ProbeConfigResponse) {};
}
