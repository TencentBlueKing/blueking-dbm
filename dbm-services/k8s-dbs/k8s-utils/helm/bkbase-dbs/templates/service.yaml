kind: Service
apiVersion: v1
metadata:
  labels:
    app: {{ .Release.Name }}
  name: bkbase-dbs-api
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.ipFamily }}
  {{- toYaml .Values.ipFamily | nindent 2 }}
  {{- end }}
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
      name: api
  selector:
    app: bkbase-dbs
  type: {{ .Values.server.serviceType }}
