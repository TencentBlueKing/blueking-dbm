{{- if .Values.observeConfig.svcMonitor.enabled }}
{{- $user := include "surreal.user" . | trim }}
{{- $pass := include "surreal.pass" . | trim }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-servicemonitor
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-servicemonitor
    {{- if .Values.observeConfig.svcMonitor.labels }}
    {{- toYaml .Values.observeConfig.svcMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - interval: {{ .Values.observeConfig.svcMonitor.interval }}
      params: {}
      path: /metrics
      port: http
      {{- if and $user $pass }}
      basicAuth:
        username:
          name: {{ .Release.Name }}-metrics-auth
          key: username
        password:
          name: {{ .Release.Name }}-metrics-auth
          key: password
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchExpressions:
      - { key: apps.kubeblocks.io/component-name, operator: In, values: [ surreal ] }
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/managed-by: kubeblocks
  targetLabels:
    - app.kubernetes.io/instance
    - app.kubernetes.io/managed-by
    - apps.kubeblocks.io/component-name

{{- end }}