{{- $user := include "surreal.user" . | trim }}
{{- $pass := include "surreal.pass" . | trim }}
{{- if and .Values.observeConfig.svcMonitor.enabled $user $pass }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-metrics-auth
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: kubernetes.io/basic-auth
data:
  username: {{ $user | b64enc | quote }}
  password: {{ $pass | b64enc | quote }}
{{- end }}
