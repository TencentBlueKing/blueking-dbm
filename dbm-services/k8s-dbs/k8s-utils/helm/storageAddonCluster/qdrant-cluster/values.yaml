# Default values for qdrant cluster.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

clusterName: qdrant-cluster
namespace: default
labels:
annotations:
terminationPolicy: Delete
topoName: cluster
addonVersion: "1.0.0"
componentList:
  - componentName: qdrant
    componentDef: qdrant
    serviceVersion: "1.16.3"
    env:
      # Uncomment to enable API key authentication for Qdrant
      # QDRANT__SERVICE__API_KEY: "your-secret-api-key-here"
    replicas: 1
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "1Gi"
    volumeClaimTemplates:
      accessModes: ["ReadWriteOnce"]
      storage: "100Gi"
      storageClassName: "cbs"
      volumeMode: "Filesystem"

observeConfig:
  bkLogConfig:
    enabled: true
    labels: {}
    dataId:
  svcMonitor:
    enabled: true
    labels: {}
    interval: "15s"