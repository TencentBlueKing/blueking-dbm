{{- if .Values.observeConfig.svcMonitor.enabled }}
{{- $apiKey := include "qdrant.apiKey" . | trim }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-servicemonitor
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-servicemonitor
    {{- if .Values.observeConfig.svcMonitor.labels }}
    {{- toYaml .Values.observeConfig.svcMonitor.labels | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - interval: {{ .Values.observeConfig.svcMonitor.interval }}
      params: {}
      path: /metrics
      port: tcp-qdrant
      {{- if $apiKey }}
      bearerTokenSecret:
        name: {{ .Release.Name }}-apikey
        key: api-key
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchExpressions:
      - { key: apps.kubeblocks.io/component-name, operator: In, values: [ qdrant ] }
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/managed-by: kubeblocks
  targetLabels:
    - app.kubernetes.io/instance
    - app.kubernetes.io/managed-by
    - apps.kubeblocks.io/component-name

{{- end }}