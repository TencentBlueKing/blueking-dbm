apiVersion: apps.kubeblocks.io/v1alpha1
kind: ComponentVersion
metadata:
  name: {{ include "qdrant.cmpvName" . }}
  labels:
    {{- include "qdrant.labels" . | nindent 4 }}
  annotations:
    {{- include "qdrant.apiVersion" . | nindent 4 }}
spec:
  compatibilityRules:
  - compDefs:
    - {{ include "qdrant.cmpdRegexPattern" . }}
    releases:
    - 1.16.1
    - 1.16.2
    - 1.16.3
    - 1.17.1
    - 1.18.3
  releases:
  - name: 1.16.1
    serviceVersion: 1.16.1
    images:
      qdrant: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository}}:v1.16.1
      qdrant-tools:  {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.tools.repository }}:{{ .Values.image.tools.tag | default "latest" }}
  - name: 1.16.2
    serviceVersion: 1.16.2
    images:
      qdrant: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository}}:v1.16.2
      qdrant-tools:  {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.tools.repository }}:{{ .Values.image.tools.tag | default "latest" }}
  - name: 1.16.3
    serviceVersion: 1.16.3
    images:
      qdrant: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository}}:v1.16.3
      qdrant-tools:  {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.tools.repository }}:{{ .Values.image.tools.tag | default "latest" }}
  - name: 1.17.1
    serviceVersion: 1.17.1
    images:
      qdrant: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository}}:v1.17.1
      qdrant-tools: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.tools.repository }}:{{ .Values.image.tools.tag | default "latest" }}
  - name: 1.18.3
    serviceVersion: 1.18.3
    images:
      qdrant: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.repository}}:v1.18.3
      qdrant-tools: {{ .Values.image.registry | default "docker.io" }}/{{ .Values.image.tools.repository }}:{{ .Values.image.tools.tag | default "latest" }}
