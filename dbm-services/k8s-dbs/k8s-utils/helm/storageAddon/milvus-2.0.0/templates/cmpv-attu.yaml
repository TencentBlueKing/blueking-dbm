apiVersion: apps.kubeblocks.io/v1alpha1
kind: ComponentVersion
metadata:
  name: {{ include "milvus.attu.cmpvName" . }}
spec:
  compatibilityRules:
    - releases:
        - attu-v2.5.6-2.0.0
        - attu-v2.6.0-2.0.0
        - attu-v2.6.3-2.0.0
      compDefs:
        - attu-2.0.0
  releases:
    - name: attu-v2.5.6-2.0.0
      serviceVersion: 2.5.6-2.0.0
      images:
        attu: zilliz/attu:v2.5.6
    - name: attu-v2.6.0-2.0.0
      serviceVersion: 2.6.0-2.0.0
      images:
        attu: zilliz/attu:v2.6.0
    - name: attu-v2.6.3-2.0.0
      serviceVersion: 2.6.3-2.0.0
      images:
        attu: zilliz/attu:v2.6.3