version: "2"

run:
  # default concurrency is a available CPU number
  concurrency: 4
  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 2m
  # exit code when at least one issue was found, default is 1
  issues-exit-code: 1
  # include test files or not, default is true
  tests: false

linters:
  default: none
  enable:
    - funlen
    - goconst
    - gocyclo
    - ineffassign
    - staticcheck
    - revive
    - govet
    - lll
    - rowserrcheck
    - errcheck
    - unused
    - sqlclosecheck
    - gocritic
    - bodyclose

  settings:
    lll:
      line-length: 120
    funlen:
      lines: 80
      statements: 80
    gocyclo:
      min-complexity: 20
    gocritic:
      enabled-checks:
        - nestingReduce

  exclusions:
    paths:
      - ".*/mock/.*.go"
      - ".*testing.go"
    rules:
      # 项目内已有大量名为 util 的包，重命名成本高，暂时忽略 var-naming 对包名的检查
      - linters:
          - revive
        text: "var-naming: avoid meaningless package names"

formatters:
  enable:
    - gofmt
    - goimports