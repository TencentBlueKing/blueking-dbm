# dbm-services 下有多个 Go module，go 版本从 1.19 到 1.25.11 不等。
# goimports / go mod tidy 用仓库当前最高版本即可：新 toolchain 能处理旧 module，反过来不行。
# GOTOOLCHAIN=local 避免 CI 再去拉各模块自己的 toolchain，也不改写 go.mod 里的 toolchain 行。

name: Go Lint

on:
  workflow_dispatch:
  push:
    paths:
      - "dbm-services/**"
      - ".github/workflows/go_code_check.yml"
  pull_request:
    paths:
      - "dbm-services/**"
      - ".github/workflows/go_code_check.yml"

jobs:
  lint:
    name: goimports and tidy
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache: false

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.24.0

      - name: Run goimports
        run: goimports -w dbm-services

      - name: Run go mod tidy on all modules
        run: find dbm-services -name go.mod -not -path "*/vendor/*" -execdir go mod tidy \;

      - name: Verify no changes from goimports and go mod tidy
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'To fix this check, run:'
            echo '  goimports -w dbm-services && find dbm-services -name go.mod -not -path "*/vendor/*" -execdir go mod tidy \;'
            git status
            git diff
            exit 1
          fi

