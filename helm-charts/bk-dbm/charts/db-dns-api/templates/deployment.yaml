{{- $kms := (.Values.global | default dict).kms | default dict }}
{{- $kmsEnabled := $kms.enabled | default false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "db-dns-api.fullname" . }}
  labels:
    {{ include "db-dns-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "db-dns-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        {{- include "db-dns-api.selectorLabels" . | nindent 8 }}
    spec:
      volumes:
        - name: gcsdnsdir
          emptyDir: {}
        -
          name: config-volume
          configMap:
            name:  db-dns-api-configmap
            items:
              -
                key: config.yaml
                mode: 420
                path: path/to/config.yaml
            defaultMode: 272
        {{- if $kmsEnabled }}
        - name: kms-credentials
          secret:
            secretName: {{ $kms.secretName | default "bk-dbm-kms" | quote }}
            defaultMode: 0400
            items:
              - key: envelope
                path: envelope
        {{- end }}
    {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ template "db-dns-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry | default .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- if .Values.envs -}}
              {{- include "envs" . | trim | nindent 12 }}
            {{- end }}
            - name: ENABLE_KMS
              value: {{ $kmsEnabled | quote }}
            {{- if $kmsEnabled }}
            - name: DB_DNS_API_KMS_CREDENTIAL_DIR
              value: {{ .Values.kms.credentialDir | quote }}
            - name: BK_DBM_KMS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $kms.secretName | default "bk-dbm-kms" | quote }}
                  key: privateKey
            {{- end }}

          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsCM }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            -
              name: config-volume
              subPath: path/to/config.yaml
              mountPath: /conf/config.yaml
            {{- if $kmsEnabled }}
            - name: kms-credentials
              mountPath: {{ .Values.kms.credentialDir | quote }}
              readOnly: true
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
