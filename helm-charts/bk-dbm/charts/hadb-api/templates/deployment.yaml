{{- $kms := (.Values.global | default dict).kms | default dict }}
{{- $kmsEnabled := $kms.enabled | default false }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hadb-api.fullname" . }}
  labels:
    {{- include "hadb-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hadb-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        reloader.stakater.com/auto: "true"
      labels:
        {{- include "hadb-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hadb-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      volumes:
        -
          name: config-volume
          configMap:
            name:  hadb-api-configmap
            items:
              -
                key: config.yaml
                path: config.yaml
                mode: 420
            defaultMode: 272
        {{- if $kmsEnabled }}
        - name: kms-credentials
          secret:
            secretName: {{ $kms.secretName | default "bk-dbm-kms" | quote }}
            defaultMode: 0400
            items:
              - key: envelope
                path: envelope
        {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          args:
          - run
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry | default .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ENABLE_KMS
              value: {{ $kmsEnabled | quote }}
            {{- if $kmsEnabled }}
            - name: HADB_API_KMS_CREDENTIAL_DIR
              value: {{ .Values.kms.credentialDir | quote }}
            - name: BK_DBM_KMS_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $kms.secretName | default "bk-dbm-kms" | quote }}
                  key: privateKey
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            -
              name: config-volume
              mountPath: /home/hadb/conf
            {{- if $kmsEnabled }}
            - name: kms-credentials
              mountPath: {{ .Values.kms.credentialDir | quote }}
              readOnly: true
            {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
