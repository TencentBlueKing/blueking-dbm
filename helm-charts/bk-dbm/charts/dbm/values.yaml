# use parent values

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

securityContext: {}

livenessProbe: {}

readinessProbe: {}

initJob:
  resources: {}

saas:
  api:
    enabled: true
    resources: {}
    replicaCount: 1
    gunicornWorker: 8
    timeout: 120
    maxRequests: 5000
    maxRequestsJitter: 500
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  backendApi:
    enabled: true
    resources: {}
    replicaCount: 1
    gunicornWorker: 8
    timeout: 300
    maxRequests: 5000
    maxRequestsJitter: 500
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  ws:
    enabled: true
    resources: {}
    replicaCount: 1
    workers: 4
    timeoutKeepAlive: 75
    wsPingInterval: 30
    wsPingTimeout: 30
    terminationGracePeriodSeconds: 60
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  celeryWorker:
    enabled: true
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  pipelineWorker:
    enabled: true
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  celeryBeat:
    enabled: true
    resources: {}
    replicaCount: 1

ingressWs:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hostname: ""
  paths:
    - path: /ws
      pathType: Prefix
  tls: []
