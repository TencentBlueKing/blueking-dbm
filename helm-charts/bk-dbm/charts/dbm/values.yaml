# use parent values

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

securityContext: {}

livenessProbe: {}

readinessProbe: {}

initJob:
  resources: {}

saas:
  aidevApi:
    enabled: false
    replicaCount: 1
    gunicornWorker: 8
    threads: 4
    timeout: 300
    gracefulTimeout: 300
    terminationGracePeriodSeconds: 330
    maxRequests: 5000
    maxRequestsJitter: 500
    resources: {}
    ingress:
      enabled: true
      # Empty values inherit the SaaS Ingress class/hostname/TLS.
      className: ""
      hosts: []
      tls: []
      # Set to "" when the external URL has no subpath.
      pathPrefix: /bkdbm
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  api:
    enabled: true
    resources: {}
    replicaCount: 1
    gunicornWorker: 8
    timeout: 120
    maxRequests: 5000
    maxRequestsJitter: 500
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  backendApi:
    enabled: true
    resources: {}
    replicaCount: 1
    gunicornWorker: 8
    timeout: 300
    maxRequests: 5000
    maxRequestsJitter: 500
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  celeryWorker:
    enabled: true
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  pipelineWorker:
    enabled: true
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  celeryBeat:
    enabled: true
    resources: {}
    replicaCount: 1
