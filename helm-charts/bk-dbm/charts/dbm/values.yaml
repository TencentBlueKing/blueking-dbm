# use parent values

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext: {}

nodeSelector: {}

tolerations: []

affinity: {}

securityContext: {}

livenessProbe: {}

readinessProbe: {}

initJob:
  resources: {}

saas:
  aidevApi:
    enabled: false
    replicaCount: 1
    gunicornWorker: 8
    threads: 4
    timeout: 300
    gracefulTimeout: 300
    terminationGracePeriodSeconds: 330
    maxRequests: 5000
    maxRequestsJitter: 500
    resources: {}
    ingress:
      enabled: true
      # Empty values inherit the SaaS Ingress class/hostname/TLS.
      className: ""
      hosts: []
      tls: []
      # Set to "" when the external URL has no subpath.
      pathPrefix: /bkdbm
      annotations:
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  api:
    enabled: true
    resources: {}
    replicaCount: 1
    gunicornWorker: 8
    timeout: 120
    maxRequests: 5000
    maxRequestsJitter: 500
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  backendApi:
    enabled: true
    resources: {}
    replicaCount: 1
    gunicornWorker: 8
    timeout: 300
    maxRequests: 5000
    maxRequestsJitter: 500
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  ws:
    enabled: true
    resources: {}
    replicaCount: 1
    workers: 4
    timeoutKeepAlive: 75
    wsPingInterval: 30
    wsPingTimeout: 30
    terminationGracePeriodSeconds: 60
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  celeryWorker:
    enabled: true
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  pipelineWorker:
    enabled: true
    resources: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 80
  celeryBeat:
    enabled: true
    resources: {}
    replicaCount: 1

ingressWs:
  enabled: false
  className: ""
  annotations:
    kubernetes.io/ingress.class: "qcloud"
    # 复用现网 CLB 时，在此配置 kubernetes.io/ingress.existLbId。
    # 使用 ClusterIP 后端时，如集群支持 CLB 直连 Pod，可启用以下配置：
    # ingress.cloud.tencent.com/direct-access: "true"
    # 空闲超时在 CLB 侧配置；应用默认每 30 秒发送一次 WebSocket Ping。
  hostname: ""
  paths:
    - path: /ws
      pathType: Prefix
  tls: []
