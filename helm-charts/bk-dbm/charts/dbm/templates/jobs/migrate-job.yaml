{{- if .Values.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dbm.migrateJobName" . }}
  labels:
    {{- include "dbm.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "dbm.labels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      {{- with include "dbm.podVolumes" . }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: dbm-migrate
          image: "{{ .Values.global.imageRegistry | default .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
          args:
            - "python manage.py migrate db_report --database=report_db && python manage.py migrate && python manage.py createcachetable django_cache"
          {{- include "dbm.container_env" . | nindent 10 }}
          resources:
            {{- toYaml .Values.initJob.resources | nindent 12 }}
{{- end }}
