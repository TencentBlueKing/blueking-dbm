{{- if .Values.bkai.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dbm.aidevInitJobName" . }}
  labels:
    {{- include "dbm.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "dbm.labels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dbm.serviceAccountName" . }}
      restartPolicy: Never
      containers:
        - name: dbm-aidev-init
          image: "{{ .Values.global.imageRegistry | default .Values.bkai.image.registry }}/{{ .Values.bkai.image.repository }}:{{ .Values.bkai.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.bkai.image.pullPolicy | default .Values.image.pullPolicy }}
          # 镜像 ENTRYPOINT: render mcps → bkai-init validate/sync
          env:
            {{- include "dbm.envs" . | trim | nindent 12 }}
            - name: BKAI_TENANT_ID
              value: {{ .Values.bkai.tenantId | default "system" | quote }}
            - name: BKAI_SPACE
              value: {{ .Values.bkai.space | quote }}
            {{- /* sprig default 会把 false 当成空，布尔开关需用 hasKey */}}
            - name: BKAI_PUBLISH
              value: {{ if hasKey .Values.bkai "publish" }}{{ ternary "1" "0" .Values.bkai.publish | quote }}{{ else }}"1"{{ end }}
            - name: BKAI_PUBLISH_CONFIG_ONLY
              value: {{ if hasKey .Values.bkai "publishConfigOnly" }}{{ ternary "1" "0" .Values.bkai.publishConfigOnly | quote }}{{ else }}"1"{{ end }}
          envFrom:
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ .Values.extraEnvVarsCM }}
            {{- end }}
          resources:
            {{- toYaml .Values.initJob.resources | nindent 12 }}
        # 占位容器：让 helm template 输出 skills-env 镜像，供流水线上传仓库
        - name: dbm-aidev-skills-env
          image: "{{ .Values.global.imageRegistry | default .Values.bkai.skillsEnvImage.registry }}/{{ .Values.bkai.skillsEnvImage.repository }}:{{ .Values.bkai.skillsEnvImage.tag }}"
          imagePullPolicy: {{ .Values.bkai.skillsEnvImage.pullPolicy | default .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - echo 1
      {{- include "dbm.initContainersWaitForMigrate" . | nindent 6 }}
      {{- if .Values.serviceInit.apigwEnabled }}
        {{- include "dbm.initContainersWaitForApigw" . | nindent 8 }}
      {{- end }}
{{- end }}
