{{- if .Values.ingressBackendApi.enabled -}}
{{- $fullName := ( include "dbm.backend-api.fullname" .) -}}
{{- $svcPort := .Values.service.port -}}
{{- if and .Values.ingressBackendApi.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.ingressBackendApi.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.ingressBackendApi.annotations "kubernetes.io/ingress.class" .Values.ingressBackendApi.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ printf "%s-%s"  (include "bk-dbm.fullname" .) "backend-api" }}
  labels:
    {{- include "bk-dbm.labels" . | nindent 4 }}
  annotations:
    {{- range $k, $v := .Values.ingressBackendApi.annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- if eq (index .Values.envs "BK_SUBPATH_ENABLED" | default false) true }}
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- end }}
spec:
  {{- if and .Values.ingressBackendApi.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingressBackendApi.className }}
  {{- end }}
  {{- if .Values.ingressBackendApi.tls }}
  tls:
    {{- range .Values.ingressBackendApi.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- if .Values.ingressBackendApi.hostname }}
    - host: {{ include "dbm.apiHost" . }}
      http:
        paths:
          {{- if eq (index .Values.envs "BK_SUBPATH_ENABLED" | default false) true }}
          - path: /bkdbm(/|$)(.*)
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: ImplementationSpecific
            {{- end }}
          {{- else }}
          - path: /
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: Prefix
            {{- end }}
          {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}
              servicePort: {{ $svcPort }}
              {{- end }}
    {{- end }}
{{- end }}
