# Default values for tenant-router
# 多租户单域名接入层路由 nginx。仅"入口 release"开启(enabled=true)，且要求 global.enableMultiTenantMode=true。

# 是否部署接入层路由（谁开启谁即为多租户入口，全局单例）
enabled: false

replicaCount: 2

image:
  registry: "mirrors.tencent.com"
  repository: "build/blueking/nginx"
  tag: "1.23.2"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "bk-dbm-tenant-router"

service:
  type: ClusterIP
  port: 80

# 前端入口 Ingress（dbm 域名，cookie 用户）
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
  hostname: "bkdbm.example.com"
  paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []

# 云区域组件 API 入口 Ingress（dbm-api 域名，header 带 X-Bk-Tenant-Id，绑定专用 CLB/授权）
ingressBackendApi:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"
  hostname: ""
  paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []

# 集群内 DNS resolver（变量 proxy_pass 运行时解析必需）
resolver: "kube-dns.kube-system.svc.cluster.local"

# 各租户 saas-api 的 Service 名（各租户 release 统一为 bk-dbm）
saasServiceName: "bk-dbm"

# 各租户 backend-api 的 Service 名（各租户 release 统一为 bk-dbm-backend-api）
backendApiServiceName: "bk-dbm-backend-api"

# 无 header/cookie 时兜底路由到的引导 namespace（运营租户所在 namespace）
bootstrapNamespace: "dbm-system"

# 请求体大小上限（与 dbm ingress 保持一致）
maxBodySize: "1024m"

# 代理读写超时（秒）
proxyTimeout: 600

# 租户 -> namespace 映射列表。新增租户在此追加一行，reloader 自动 reload。
# tenants:
#   - id: "system"
#     namespace: "dbm-system"
#   - id: "abc"
#     namespace: "dbm-abc"
tenants: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
