# @section 通用配置
# @param api pod 副本数
replicaCount: 1
image:
  # @param 镜像拉取策略
  pullPolicy: IfNotPresent
  # @param 镜像服务地址
  registry: "mirrors.tencent.com"
  # @param 仓库路径
  repository: "build/blueking/k8s-dbs"
  # @param 镜像 tag
  tag: ""

# @param ipFamily 配置, 可以执行policy，families等
ipFamily: {}

resources:
  limits:
    # @param cpu limit
    cpu: 2
    # @param memory limit
    memory: 4Gi
  requests:
    # @param cpu request
    cpu: 1
    # @param memory request
    memory: 2Gi

# @param 节点选择约束配置
nodeSelector: { }

# @param 容忍配置
tolerations: [ ]

# @param 亲和性配置
affinity: { }

containerPorts:
  # @param dbs 容器端口
  http: 8000

# @section dbs 服务配置
server:
  clbApiConfig:
    clbApiURL: ""          # clb 服务调用地址
    username: ""           # 管理人员
    backupUsername: ""     # 备份管理人员
    operationProduct: ""   # 操作产品
    firstLevelBiz: ""      # 一级业务
    secondLevelBiz: ""     # 二级业务
  dbmConfig:
    asyncToDbm: "true"
    syncDataApiUrl: ""          # 内部直连地址（同步用）
    dbmAuthApiUrl: ""           # 鉴权地址（host:port/path 格式，合并原 gateway + IAM base path）
    iamExemptStorageWhitelist: ""  # IAM 鉴权豁免存储白名单，逗号分隔 addonType，如 surrealdb,qdrant；为空则不启用豁免
    bkbaseBizApiUrl: ""            # bkbase网关获取业务列表地址
    innerBkAppCode: ""           # 统一凭据 app_code（同步 + 鉴权）
    innerBkAppSecret: ""         # 统一凭据 app_secret（同步 + 鉴权）
    bkbaseBkBizId: "0"          # BKBase 业务 ID，部署时必须配置为真实值
  log:
    log_level: "info"
    max_size_mb: "10"
    max_backups: "5"
    max_age: "3"
    compress: "true"
  vmMetricServerHost: "localhost"
  vmMetricServerPort: "80"
  # @param service type
  serviceType: ClusterIP
  # @param 时区配置
  timezone: "Asia/Shanghai"
  port: 8000
  datasource:
    # @param auth 数据库配置
    auth:
      host: ""
      port:
      user: ""
      password: ""
      dbname: ""
      tlsmode: "false"
      maxOpenConns: 10
      maxIdelConns: 5
      maxLifeTime: "30m"
      maxIdleTime: "30m"
    # @param dbs 数据库配置
    dbs:
      host: ""
      port:
      user: ""
      password: ""
      dbname: ""
      tlsmode: "false"
      maxOpenConns: 10
      maxIdelConns: 5
      maxLifeTime: "30m"
      maxIdleTime: "30m"

# @section ingress配置
ingress:
  # @param ingress 开关
  enabled: false
  # @param ingress annotations 配置
  annotations: { }
  # @param ingress tls 配置
  tls: [ ]
  independentDomain:
    enabled: false
    name: "bk-data.example.com"
# @section 全局ingress是否启用
globalIngress:
  # @param 全局ingress开关
  disabled: true

# 适用于独立集群，clb 绑定 dbs service
# @section loadbalancer配置
loadbalancer:
  # @param loadbalancer开关
  enabled: false
  # @param loadbalancer annotations配置
  annotations: {}

# @section 可用性探针配置
livenessProbe:
  httpGet:
    # @param dbs 服务就绪探针检查地址
    path: /v4/dbs/common/health
    # @param dbs 服务就绪探针检查端口
    port: 8000
  # @param dbs 服务存活探针初始化检查 delay 时间
  initialDelaySeconds: 30
  # @param dbs 服务存活探针检查周期
  periodSeconds: 30
  # @param dbs 服务存活探针检查超时时间
  timeoutSeconds: 5
  # @param dbs 服务存活探针检查成功阈值
  successThreshold: 1
  # @param dbs 服务存活探针检查失败阈值
  failureThreshold: 3

readinessProbe:
  httpGet:
    # @param dbs 服务就绪探针检查地址
    path: /v4/dbs/common/health
    # @param dbs 服务就绪探针检查端口
    port: 8000
  # @param dbs 服务就绪探针初始化检查 delay 时间
  initialDelaySeconds: 30
  # @param dbs 服务就绪探针检查周期
  periodSeconds: 30
  # @param dbs 服务就绪探针检查超时时间
  timeoutSeconds: 5
  # @param dbs 服务就绪探针检查成功阈值
  successThreshold: 1
  # @param dbs 服务就绪探针检查失败阈值
  failureThreshold: 3

# @section 日志采集配置
bkLogConfig:
  # @param 是否启用日志插件
  enabled: false
  # @param 日志采集的 Data ID
  dataId: 1
  # @param api日志文件采集的 Data ID
  dataIdForApi: 2
  # @param sys日志文件采集的 Data ID
  dataIdForSys: 3
  # @param bkLogConfig bk_env 标签
  bkEnv: ""

# @section 指标采集配置
svcMonitor:
  enabled: false
  labels: {}
  interval: "15s"
