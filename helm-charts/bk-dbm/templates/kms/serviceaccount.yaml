{{- if and (include "bk-dbm.kms.enabled" .) .Values.global.kms.serviceAccount.create }}
{{- include "bk-dbm.kms.validate" . }}
# 仅供 ESO 登录 OpenBao 使用，不绑定任何 Role，也不挂载到业务 Pod
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bk-dbm.kms.serviceAccountName" . }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
