{{- if include "bk-dbm.kms.enabled" . }}
{{- include "bk-dbm.kms.validate" . }}
{{- $kms := .Values.global.kms }}
{{- $tls := $kms.tls | default dict }}
apiVersion: {{ $kms.esoApiVersion }}
kind: SecretStore
metadata:
  name: bk-dbm-kms
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
spec:
  provider:
    vault:
      server: {{ $kms.server | quote }}
      path: {{ $kms.path | default "secret" | quote }}
      version: "v2"
      {{- if $tls.enabled }}
      {{- if $tls.certCAFilename }}
      caProvider:
        type: Secret
        name: {{ $tls.existingSecret | quote }}
        key: {{ $tls.certCAFilename | quote }}
      {{- end }}
      {{- if and $tls.certFilename $tls.certKeyFilename }}
      tls:
        certSecretRef:
          name: {{ $tls.existingSecret | quote }}
          key: {{ $tls.certFilename | quote }}
        keySecretRef:
          name: {{ $tls.existingSecret | quote }}
          key: {{ $tls.certKeyFilename | quote }}
      {{- end }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ $kms.authMountPath | default "kubernetes" | quote }}
          role: {{ $kms.role | quote }}
          serviceAccountRef:
            name: {{ include "bk-dbm.kms.serviceAccountName" . }}
{{- end }}
