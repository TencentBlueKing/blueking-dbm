{{- if include "bk-dbm.kms.enabled" . }}
{{- include "bk-dbm.kms.validate" . }}
{{- $kms := .Values.global.kms }}
apiVersion: {{ $kms.esoApiVersion }}
kind: ExternalSecret
metadata:
  name: bk-dbm-kms
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
spec:
  refreshInterval: {{ $kms.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: bk-dbm-kms
    kind: SecretStore
  target:
    name: {{ include "bk-dbm.kms.secretName" . }}
    creationPolicy: Owner
    template:
      metadata:
        annotations:
          # 私钥以 env、信封以 subPath 注入，均不会热更新；避免 Reloader 在 ESO 刷新时批量重启
          reloader.stakater.com/ignore: "true"
  data:
    - secretKey: privateKey
      remoteRef:
        key: {{ $kms.credentialKey | quote }}
        property: private_key
    - secretKey: envelope
      remoteRef:
        key: {{ $kms.credentialKey | quote }}
        property: envelope
{{- end }}
