{{- $dnsDB := fromYaml (include "bk-dbm.database" (list . "dbDnsApi")) -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-dns-api-configmap
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
data:
  config.yaml: |-
    db:
      username: {{ $dnsDB.user | quote }}
      password: {{ $dnsDB.password | quote }}
      host: {{ $dnsDB.host | quote }}
      port: {{ $dnsDB.port | quote }}
      name: {{ $dnsDB.name | quote }}
      auto_migration: true
    http:
      listenAddress: 0.0.0.0:80
    debug: true
    log:
      output: logs/dns_api.log
      formater: json
      level: info
      timeformat: 2006-01-02T15:04:05.000Z07:00
      maxsize: 100
      maxbackups: 3
      maxage: 30