{{- $statsDB := fromYaml (include "bk-dbm.database" (list . "dbmStats")) -}}
{{- $reportDB := fromYaml (include "bk-dbm.database" (list . "dbmReport")) -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-event-consumer-configmap
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
data:
# todo bk_data_id 应该调整为从日志平台接口获取
  config.yaml: |-
    kafka_info:
      cluster_config:
        brokers: {{ .Values.externalKafka.brokers }}
        port: {{ .Values.externalKafka.port }}
      auth_info:
        username: {{ .Values.externalKafka.username }}
        password: {{ .Values.externalKafka.password }}
        sasl_mechanisms: {{ .Values.externalKafka.sasl_mechanisms }}
        security_protocol: {{ .Values.externalKafka.security_protocol }}
    log:
      console: true
      debug: true
      source: true
      json: false
      log_file_dir: logs
    bkm_report:
      data_id: {{ .Values.dbm.envs.BKAPP_MONITOR_REPORTER_DATA_ID }}
      token: {{ .Values.dbm.envs.BKAPP_MONITOR_REPORTER_ACCESS_TOKEN }}
      report_url: {{ .Values.dbm.envs.BKAPP_MONITOR_REPORTER_URL }}
    bkm_api_info:
      bk_app_code: {{ .Values.dbm.envs.bkAppCode }}
      bk_app_secret: {{ .Values.dbm.envs.bkAppToken }}
      bk_biz_id: {{ .Values.dbm.envs.dbaAppBkBizId }}
      bk_username: "{{ .Values.dbm.envs.bkAdminUser }}"
      bkmonitor_api_url: "{{ .Values.bk.bkMonitorApiUrl }}"
      bklog_api_url: "{{ .Values.dbm.envs.BKLOG_APIGW_DOMAIN }}"
    otel_port: 8000

  datasource.yaml: |-
    - name: prod_bk_dbm_report
      type: mysql
      dsn:
        address: "{{ $reportDB.host }}:{{ $reportDB.port }}"
        user: "{{ $reportDB.user }}"
        password: "{{ $reportDB.password }}"
        database: "{{ $reportDB.name }}"
        charset: utf8mb4
    - name: prod_bk_dbm_report_raw
      type: mysql_raw
      dsn:
        address: "{{ $reportDB.host }}:{{ $reportDB.port }}"
        user: "{{ $reportDB.user }}"
        password: "{{ $reportDB.password }}"
        database: "{{ $reportDB.name }}"
        charset: utf8mb4
    - name: doris_bk_dbm_stats
      type: doris
      dsn:
        address: "{{ $statsDB.host }}:{{ $statsDB.port }}"
        user: "{{ $statsDB.user }}"
        password: "{{ $statsDB.password }}"
        database: "{{ $statsDB.name }}"
        charset: utf8mb4
    - name: doris_http_bk_dbm_stats
      type: doris_http
      dsn:
        address: "{{ $statsDB.host }}:{{ $statsDB.port }}"
        fe_http_address: "{{ $statsDB.fe_http_address | default "" }}"
        user: "{{ $statsDB.user }}"
        password: "{{ $statsDB.password }}"
        database: "{{ $statsDB.name }}"
        charset: utf8mb4
  data.sinkers.yaml: |
    {{- toYaml (index .Values "db-event-consumer").sinkers | nindent 4 }}