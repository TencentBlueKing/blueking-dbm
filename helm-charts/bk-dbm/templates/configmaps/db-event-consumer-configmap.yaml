{{- $statsDB := fromYaml (include "bk-dbm.database" (list . "dbmStats")) -}}
{{- $reportDB := fromYaml (include "bk-dbm.database" (list . "dbmReport")) -}}
{{- $dec := index .Values "db-event-consumer" -}}
{{/*
externalDatabase.dbmStats 配了 fe_http_address 说明统计库是 doris，否则按 mysql 处理。
注意不能用 $statsDB.fe_http_address，bk-dbm.database 这个 helper 不输出该字段
*/}}
{{- $statsExt := (index .Values.externalDatabase "dbmStats") | default dict -}}
{{- $statsFeHttp := $statsExt.fe_http_address | default "" -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-event-consumer-configmap
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
data:
  config.yaml: |-
    kafka_info:
      cluster_config:
        brokers: {{ index $dec "kafka_info" "brokers" }}
        port: {{ index $dec "kafka_info" "broker_port" }}
      auth_info:
        username: {{ index $dec "kafka_info" "auth_info_username" }}
        password: {{ index $dec "kafka_info" "auth_info_password" }}
        sasl_mechanisms: {{ index $dec "kafka_info" "auth_info_sasl_mechanisms" }}
        security_protocol: {{ index $dec "kafka_info" "auth_info_security_protocol" }}
    log:
      console: true
      debug: true
      source: true
      json: false
      log_file_dir: logs
    bkm_report:
      data_id: {{ .Values.dbm.envs.BKAPP_MONITOR_REPORTER_DATA_ID }}
      token: {{ .Values.dbm.envs.BKAPP_MONITOR_REPORTER_ACCESS_TOKEN }}
      report_url: {{ .Values.dbm.envs.BKAPP_MONITOR_REPORTER_URL }}
    bkm_api_info:
      bk_app_code: {{ .Values.dbm.envs.bkAppCode }}
      bk_app_secret: {{ .Values.dbm.envs.bkAppToken }}
      bk_biz_id: {{ .Values.dbm.envs.dbaAppBkBizId }}
      bk_username: {{ .Values.bk.bkAdminUser | default "admin" | quote }}
      bkmonitor_api_url: "{{ .Values.bk.bkMonitorApiUrl }}"
      bklog_api_url: "{{ .Values.dbm.envs.BKLOG_APIGW_DOMAIN }}"
    otel_port: 8000
    on_missing_datasource: {{ $dec.on_missing_datasource | default "skip" }}

  datasource.yaml: |-
    - name: dbmReport
      type: mysql
      dsn:
        address: "{{ $reportDB.host }}:{{ $reportDB.port }}"
        user: "{{ $reportDB.user }}"
        password: "{{ $reportDB.password }}"
        database: "{{ $reportDB.name }}"
        charset: utf8mb4
    - name: dbmReportRaw
      type: mysql_raw
      dsn:
        address: "{{ $reportDB.host }}:{{ $reportDB.port }}"
        user: "{{ $reportDB.user }}"
        password: "{{ $reportDB.password }}"
        database: "{{ $reportDB.name }}"
        charset: utf8mb4
    - name: dbmStats
      type: {{ if $statsFeHttp }}doris{{ else }}mysql{{ end }}
      dsn:
        address: "{{ $statsDB.host }}:{{ $statsDB.port }}"
        user: "{{ $statsDB.user }}"
        password: "{{ $statsDB.password }}"
        database: "{{ $statsDB.name }}"
        charset: utf8mb4
    {{- if $statsFeHttp }}
    - name: dbmStatsHttp
      type: doris_http
      dsn:
        address: "{{ $statsDB.host }}:{{ $statsDB.port }}"
        fe_http_address: "{{ $statsFeHttp }}"
        user: "{{ $statsDB.user }}"
        password: "{{ $statsDB.password }}"
        database: "{{ $statsDB.name }}"
        charset: utf8mb4
    {{- end }}
    {{- toYaml ($dec.datasources | default list) | nindent 4 }}

  # 个性化入库项。同 key(model_table + group_id_suffix) 的项会整项覆盖
  # 程序用 --enable-defaults 生成的 data.defaults.yaml 里的默认项，将会与这个合并
  data.sinkers.yaml: |-
    {{- toYaml ($dec.sinkers | default list) | nindent 4 }}
