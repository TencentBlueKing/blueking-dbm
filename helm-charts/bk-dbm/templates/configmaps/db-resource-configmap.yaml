{{- $dbResourceDB := fromYaml (include "bk-dbm.database" (list . "dbResource")) -}}
{{- $dbmDB := fromYaml (include "bk-dbm.database" (list . "dbm")) -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: db-resource-configmap
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
data:
  config.yaml: |-
    gormlog: true
    listenAddress: 0.0.0.0:80
    dbmeta: {{ .Values.dbm.internalDomain | default "http://bk-dbm" }}
    bkJobApiUrl: {{ .Values.bk.bkJobApiUrl }}
    bkCmdbApiUrl: {{ .Values.bk.bkCmdbApiUrl }}
    bkNodeManApiUrl: {{ .Values.bk.bkNodemanApiUrl }}
    db:
      name:  "{{ $dbResourceDB.name }}"
      addr:  "{{ $dbResourceDB.host }}:{{ $dbResourceDB.port }}"
      username:  "{{ $dbResourceDB.user }}"
      password:  "{{ $dbResourceDB.password }}"
    cmdb_db:
      name:  "{{ $dbmDB.name }}"
      addr:  "{{ $dbmDB.host }}:{{ $dbmDB.port }}"
      username:  "{{ $dbmDB.user }}"
      password:  "{{ $dbmDB.password }}"
    redis:
      addr:  "{{ .Values.externalRedis.host }}:{{ .Values.externalRedis.port }}"
      password: {{ .Values.externalRedis.password }}
    bkSecretConfig:
      bk_app_code: {{ .Values.dbm.envs.bkAppCode }}
      bk_app_secret: {{ .Values.dbm.envs.bkAppToken }}
      bk_username:  "admin"
      bk_base_url: {{ .Values.bk.bkComponentApiUrl }}
    cloudCertificate:
      cloud_vendor: "{{ index .Values "db-resource" "envs" "cloudVendor" }}"
      secret_id: "{{ index .Values "db-resource" "envs" "secretId" }}"
      secret_key: "{{ index .Values "db-resource" "envs" "secretKey" }}"
    yunti:
      addr:  "{{ index .Values "db-resource" "envs" "yuntiAddr" }}"
      api_key_name:  "{{ index .Values "db-resource" "envs" "api_key_name" }}"
      api_key_secret:  "{{ index .Values "db-resource" "envs" "api_key_secret" }}"
      interface_name:  "{{ index .Values "db-resource" "envs" "interface_name" }}"
    llm:
      enabled: "{{ index .Values "db-resource" "envs" "enable_llm" }}"
      provider: "{{ index .Values "db-resource" "envs" "llm_provider" }}"
      agent:
        max_iterations: {{ index .Values "db-resource" "envs" "agent_max_iterations" | default 15 }}
        timeout_seconds: {{ index .Values "db-resource" "envs" "agent_timeout_seconds" | default 360 }}
      bk_ai:
        app_code:  "{{ index .Values "db-resource" "envs" "bk_ai_app_code" }}"
        app_secret: "{{ index .Values "db-resource" "envs" "bk_ai_app_secret" }}"
        base_url: "{{ index .Values "db-resource" "envs" "bk_ai_base_url" }}"
        model: "{{ index .Values "db-resource" "envs" "llm_model" }}"
        max_tokens: "{{ index .Values "db-resource" "envs" "llm_max_tokens" }}"
        temperature: "{{ index .Values "db-resource" "envs" "temperature" }}"
