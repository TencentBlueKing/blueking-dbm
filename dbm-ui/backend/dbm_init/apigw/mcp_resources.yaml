components:
  schemas:
    AffinityEnum:
      enum:
      - SAME_SUBZONE_CROSS_SWTICH
      - SAME_SUBZONE
      - CROS_SUBZONE
      - CROSS_RACK
      - NONE
      - MAX_EACH_ZONE_EQUAL
      - CROSS_SUBZONE_STRONG
      - CROSS_SUBZONE_WEAK
      type: string
      description: |-
        * `SAME_SUBZONE_CROSS_SWTICH` - 指定园区
        * `SAME_SUBZONE` - 指定园区(无机架要求)
        * `CROS_SUBZONE` - 跨园区
        * `CROSS_RACK` - 不限园区
        * `NONE` - 无
        * `MAX_EACH_ZONE_EQUAL` - 每个subzone尽量均匀分布
        * `CROSS_SUBZONE_STRONG` - 跨园区(强)
        * `CROSS_SUBZONE_WEAK` - 跨园区(弱)
    BackupTypeEnum:
      enum:
      - logical
      - physical
      type: string
      description: |-
        * `logical` - 逻辑备份
        * `physical` - 物理备份
    BillStatusTrackerInputRequest:
      type: object
      properties:
        bk_biz_id:
          type: integer
          description: 业务 ID
        bill_id:
          type: integer
          description: 单据 ID
      required:
      - bill_id
      - bk_biz_id
    BillStatusTrackerOutput:
      type: object
      properties:
        bk_biz_id:
          type: integer
          description: 业务 ID
        bill_id:
          type: integer
          description: 单据 ID
        status:
          allOf:
          - $ref: '#/components/schemas/BillStatusTrackerOutputStatusEnum'
          description: |-
            单据状态

            * `PENDING` - 等待中
            * `APPROVE` - 待审批
            * `RESOURCE_REPLENISH` - 待补货
            * `TODO` - 待执行
            * `TIMER` - 定时中
            * `RUNNING` - 执行中
            * `SUCCEEDED` - 已完成
            * `FAILED` - 已失败
            * `REVOKED` - 已撤销
            * `TERMINATED` - 已终止
            * `INNER_TODO` - 待继续
        current_flow:
          type: string
          description: 当前流程名称
        cost_time_seconds:
          type: integer
          description: 以秒为单位的耗时
        msgs:
          type: array
          items:
            type: string
          description: 单据信息
      required:
      - bill_id
      - bk_biz_id
      - cost_time_seconds
      - current_flow
      - msgs
      - status
    BillStatusTrackerOutputStatusEnum:
      enum:
      - PENDING
