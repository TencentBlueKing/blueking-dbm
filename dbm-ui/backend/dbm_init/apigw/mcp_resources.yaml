  /apis/ai/mcp_tools/mysql/show_cluster_processlist/:
    post:
      operationId: mysql_query_show_cluster_processlist
      description: "查询集群连接列表\n            1. 连接信息的原始详情可用于人工阅读分析\n            2. 按\
        \ host 或者 user 或者 db 或者 state 的聚合结果可以分析连接概况\n            3. 详情列表的 count 数量就是对应实例或者集群的总连接数.\
        \ 可以结合最大连接数(max_connections)运行时参数来评估实例的连接够不够用\n            4. addresses 参数默认为\
        \ None, 按不同的集群类型有不同的含义\n              * 当集群类型为 TenDBSingle 时, 获取所有存储层的连接信息\n\
        \              * 当集群类型为 TenDBHA 时, 获取所有接入层(proxy)的连接信息\n              * 当集群类型为\
        \ TenDBCluster 时, 获取所有主接入层(spider master)的连接信息\n            5. addresses 不为空时,\
        \ 获取指定实例的连接信息\n            6. addresses 要么为 None, 要么只能是 ip:port 形式的实例列表\n\
        \            "
      tags:
      - read
      - mcp-tools
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowProcessListInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShowProcessListInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShowProcessListInputRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowProcessListOutput'
          description: ''
      x-bk-apigateway-resource:
        isPublic: false
        matchSubpath: false
        backend:
          name: default
          method: post
          path: /apis/ai/mcp_tools/mysql/show_cluster_processlist/
          matchSubpath: false
          timeout: 0
        pluginConfigs:
        - type: bk-header-rewrite
          yaml: |
            remove: []
            set:
            - key: X-Bkdbm-Mcp-Tag
              value: read,mcp-tools
        allowApplyPermission: false
        authConfig:
          userVerifiedRequired: true
          appVerifiedRequired: true
          resourcePermissionRequired: true
        descriptionEn: "查询集群连接列表\n            1. 连接信息的原始详情可用于人工阅读分析\n            2.\
          \ 按 host 或者 user 或者 db 或者 state 的聚合结果可以分析连接概况\n            3. 详情列表的 count\
          \ 数量就是对应实例或者集群的总连接数. 可以结合最大连接数(max_connections)运行时参数来评估实例的连接够不够用\n     \
          \       4. addresses 参数默认为 None, 按不同的集群类型有不同的含义\n              * 当集群类型为\
          \ TenDBSingle 时, 获取所有存储层的连接信息\n              * 当集群类型为 TenDBHA 时, 获取所有接入层(proxy)的连接信息\n\
          \              * 当集群类型为 TenDBCluster 时, 获取所有主接入层(spider master)的连接信息\n \
          \           5. addresses 不为空时, 获取指定实例的连接信息\n            6. addresses 要么为\
          \ None, 要么只能是 ip:port 形式的实例列表\n            "
